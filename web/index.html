<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2FA 备用密钥提取 · Material</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />

    <!-- jsQR 库 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>

    <style id="theme-styles">
        /* ===== 颜色主题变量（只定义主色等，不定义背景） ===== */
        :root {
            --md-primary: #1A73E8;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #D2E3FC;
            --md-on-primary-container: #041E49;
        }

        /* ===== 亮色模式（默认） ===== */
        :root,
        body.light-mode {
            --md-surface: #FFFFFF;
            --md-surface-variant: #F1F4F9;
            --md-outline: #D3D9E3;
            --md-on-surface: #1E293B;
            --md-on-surface-variant: #475569;
            --md-background: #F6F9FC;
            --md-shadow: 0 8px 30px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);
            --md-card-shadow: 0 8px 30px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        /* ===== 暗色模式 ===== */
        body.dark-mode {
            --md-surface: #2C2C2C;
            --md-surface-variant: #3A3A3A;
            --md-outline: #5A5A5A;
            --md-on-surface: #E8E8E8;
            --md-on-surface-variant: #B0B0B0;
            --md-background: #1A1A1A;
            --md-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --md-card-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            /* 调整主色容器与文字颜色以适配暗色 */
            --md-primary-container: #1E3A5F;
            --md-on-primary-container: #E3F0FF;
            --md-on-primary: #0B1E33; /* 主色按钮上的文字在暗色下用深色 */
        }
        /* 暗色下主色按钮文字颜色修正 */
        body.dark-mode .btn-primary,
        body.dark-mode .badge-local {
            color: var(--md-on-primary);
        }
        /* 暗色下上传区域背景微调 */
        body.dark-mode .upload-zone {
            background: var(--md-surface-variant);
        }
        body.dark-mode .upload-zone:hover {
            background: var(--md-primary-container);
        }
        body.dark-mode .secret-value {
            background: #3A3A3A;
            color: var(--md-on-surface);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }
        body.dark-mode .snackbar {
            background: #3A3A3A;
            color: #E8E8E8;
        }
        body.dark-mode .snackbar .material-symbols-outlined {
            color: #81C784;
        }
        body.dark-mode .status-box.error {
            background: #3D1F1E;
            border-left-color: #EF5350;
        }
        body.dark-mode .status-box.success {
            background: #1D3A2A;
            border-left-color: #66BB6A;
        }
        body.dark-mode .uri-row {
            border-color: var(--md-outline);
        }
        /* 设置页面卡片在暗色下 */
        body.dark-mode .card {
            background: var(--md-surface);
            box-shadow: var(--md-card-shadow);
        }
        body.dark-mode .theme-option {
            background: var(--md-surface-variant);
        }
        body.dark-mode .theme-option.active {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
        }
        body.dark-mode .btn-secondary {
            color: var(--md-on-surface-variant);
            border-color: var(--md-outline);
        }
        body.dark-mode .btn-secondary:hover {
            background: var(--md-surface-variant);
        }
        body.dark-mode .header-right a {
            color: var(--md-on-surface-variant);
        }
        body.dark-mode .header-right a:hover {
            background: var(--md-surface-variant);
        }
    </style>

    <style>
        /* ===== 基础样式 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            background: var(--md-background);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: var(--md-on-surface);
            transition: background 0.25s, color 0.25s;
        }

        .card {
            max-width: 640px;
            width: 100%;
            background: var(--md-surface);
            border-radius: 24px;
            padding: 32px 28px 36px;
            box-shadow: var(--md-card-shadow);
            transition: background 0.25s, box-shadow 0.25s;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--md-on-surface);
            margin: 0;
        }
        .header-left .material-symbols-outlined {
            font-size: 32px;
            color: var(--md-primary);
        }
        .header-right .material-symbols-outlined {
            font-size: 28px;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
            text-decoration: none;
        }
        .header-right .material-symbols-outlined:hover {
            background: var(--md-surface-variant);
        }

        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            margin-bottom: 28px;
            color: var(--md-on-surface-variant);
            font-size: 15px;
            font-weight: 400;
            flex-wrap: wrap;
            gap: 6px 0;
        }
        .badge-local {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-local .material-symbols-outlined {
            font-size: 18px;
        }

        /* ===== 上传区域 ===== */
        .upload-zone {
            border: 2px dashed var(--md-outline);
            border-radius: 16px;
            padding: 44px 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            background: var(--md-surface-variant);
            position: relative;
            margin-bottom: 20px;
        }
        .upload-zone:hover {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
        }
        .upload-zone.dragover {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
            transform: scale(0.99);
        }
        .upload-zone .icon-upload {
            font-size: 52px;
            color: var(--md-primary);
            display: block;
            margin-bottom: 8px;
        }
        .upload-zone p {
            font-weight: 500;
            font-size: 17px;
            color: var(--md-on-surface);
            margin: 0;
        }
        .upload-zone .hint {
            color: var(--md-on-surface-variant);
            font-size: 14px;
            margin-top: 4px;
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ===== 状态条 ===== */
        .status-box {
            background: var(--md-surface-variant);
            border-radius: 16px;
            padding: 14px 20px;
            margin: 12px 0 16px;
            display: none;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }
        .status-box.show {
            display: flex;
        }
        .status-box .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--md-outline);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .status-box .status-icon {
            font-size: 24px;
            flex-shrink: 0;
        }
        .status-box.error {
            background: #FEF1F0;
            border-left-color: #D32F2F;
        }
        body.dark-mode .status-box.error {
            background: #3D1F1E;
            border-left-color: #EF5350;
        }
        .status-box.success {
            background: #ECF7ED;
            border-left-color: #2E7D32;
        }
        body.dark-mode .status-box.success {
            background: #1D3A2A;
            border-left-color: #66BB6A;
        }

        /* ===== 结果展示 ===== */
        .result-section {
            display: none;
            margin-top: 16px;
            animation: fadeUp 0.3s ease;
        }
        .result-section.show {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .secret-row {
            background: var(--md-surface-variant);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .secret-label {
            font-weight: 600;
            color: var(--md-on-surface);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .secret-label .material-symbols-outlined {
            font-size: 20px;
            color: var(--md-primary);
        }
        .secret-value {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--md-on-surface);
            word-break: break-all;
            flex: 1;
            min-width: 120px;
            background: var(--md-surface);
            padding: 4px 14px;
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            transition: background 0.2s;
        }
        .btn-copy {
            background: var(--md-surface);
            border: 1px solid var(--md-outline);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            color: var(--md-on-surface);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn-copy:hover {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
        }
        .btn-copy:active {
            transform: scale(0.96);
        }
        .btn-copy .material-symbols-outlined {
            font-size: 18px;
        }

        .uri-row {
            background: var(--md-surface-variant);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--md-on-surface-variant);
            word-break: break-all;
            border: 1px solid var(--md-outline);
            margin-top: 4px;
            transition: background 0.2s, border-color 0.2s;
        }
        .uri-row strong {
            color: var(--md-on-surface);
            font-weight: 600;
        }

        /* ===== 重置按钮 ===== */
        .reset-row {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--md-outline);
            text-align: center;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--md-outline);
            border-radius: 40px;
            color: var(--md-on-surface-variant);
            padding: 10px 32px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-secondary:hover {
            background: var(--md-surface-variant);
            border-color: var(--md-on-surface-variant);
        }
        .btn-secondary .material-symbols-outlined {
            font-size: 18px;
        }

        /* ===== Snackbar ===== */
        .snackbar {
            position: fixed;
            top: 24px;
            right: 24px;
            background: #1E293B;
            color: #FFFFFF;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(-16px) scale(0.96);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 1000;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .snackbar.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .snackbar .material-symbols-outlined {
            font-size: 22px;
            color: #81C784;
        }
        body.dark-mode .snackbar {
            background: #3A3A3A;
            color: #E8E8E8;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .card {
                padding: 20px 16px 28px;
            }
            .header-left h1 {
                font-size: 24px;
            }
            .secret-row {
                flex-direction: column;
                align-items: stretch;
            }
            .secret-value {
                font-size: 17px;
                text-align: center;
            }
            .btn-copy {
                align-self: center;
            }
            .snackbar {
                top: 16px;
                right: 16px;
                left: 16px;
                max-width: none;
                font-size: 14px;
                padding: 12px 18px;
            }
            .upload-zone {
                padding: 32px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Snackbar ===== -->
    <div id="snackbar" class="snackbar">
        <span class="material-symbols-outlined">check_circle</span>
        <span id="snackbarMessage">备用密钥已复制，请务必放在您认为安全的地方</span>
    </div>

    <!-- ===== 主卡片 ===== -->
    <div class="card">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <span class="material-symbols-outlined">key</span>
                <h1>备用密钥提取</h1>
            </div>
            <div class="header-right">
                <a href="settings.html" class="material-symbols-outlined" title="设置主题与模式">settings</a>
            </div>
        </div>
        <div class="subhead">
            <span>从 2FA 二维码中提取 Secret</span>
            <span class="badge-local">
                <span class="material-symbols-outlined">shield</span>
                本地处理 · 不上传
            </span>
        </div>

        <!-- 上传区域 -->
        <div class="upload-zone" id="uploadZone">
            <span class="material-symbols-outlined icon-upload">cloud_upload</span>
            <p>点击选择或拖拽图片至此</p>
            <div class="hint">支持 PNG · JPG · WebP · GIF · BMP</div>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <!-- 状态 -->
        <div id="statusBox" class="status-box">
            <span class="status-icon" id="statusIcon">⏳</span>
            <span id="statusText">正在识别二维码…</span>
        </div>

        <!-- 结果 -->
        <div id="resultSection" class="result-section">
            <div class="secret-row">
                <span class="secret-label">
                    <span class="material-symbols-outlined">password</span>
                    备用密钥
                </span>
                <span class="secret-value" id="secretDisplay">****</span>
                <button class="btn-copy" id="copyBtn">
                    <span class="material-symbols-outlined">content_copy</span> 复制
                </button>
            </div>
            <div class="uri-row">
                <strong>完整 URI</strong><br />
                <span id="uriDisplay">—</span>
            </div>
        </div>

        <!-- 重置 -->
        <div class="reset-row">
            <button class="btn-secondary" id="resetBtn">
                <span class="material-symbols-outlined">refresh</span> 重新开始
            </button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== 应用颜色主题 =====
            function applyColorTheme(themeName) {
                const root = document.documentElement;
                const themes = {
                    blue: {
                        primary: '#1A73E8',
                        onPrimary: '#FFFFFF',
                        primaryContainer: '#D2E3FC',
                        onPrimaryContainer: '#041E49',
                    },
                    purple: {
                        primary: '#7C3AED',
                        onPrimary: '#FFFFFF',
                        primaryContainer: '#E4D7F5',
                        onPrimaryContainer: '#2D1B4E',
                    },
                    pink: {
                        primary: '#D81B60',
                        onPrimary: '#FFFFFF',
                        primaryContainer: '#F8D4E0',
                        onPrimaryContainer: '#4A0D24',
                    },
                    green: {
                        primary: '#0F7B3A',
                        onPrimary: '#FFFFFF',
                        primaryContainer: '#C8E6C9',
                        onPrimaryContainer: '#052E14',
                    },
                    orange: {
                        primary: '#E65100',
                        onPrimary: '#FFFFFF',
                        primaryContainer: '#FDE0C8',
                        onPrimaryContainer: '#4A1A00',
                    }
                };
                const theme = themes[themeName] || themes.blue;
                root.style.setProperty('--md-primary', theme.primary);
                root.style.setProperty('--md-on-primary', theme.onPrimary);
                root.style.setProperty('--md-primary-container', theme.primaryContainer);
                root.style.setProperty('--md-on-primary-container', theme.onPrimaryContainer);
                localStorage.setItem('md3_color_theme', themeName);
            }

            // ===== 应用外观模式 =====
            function applyAppearanceMode(mode) {
                const body = document.body;
                // 移除所有模式类
                body.classList.remove('light-mode', 'dark-mode');
                if (mode === 'auto') {
                    // 跟随系统
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    body.classList.add(prefersDark ? 'dark-mode' : 'light-mode');
                } else {
                    body.classList.add(mode === 'dark' ? 'dark-mode' : 'light-mode');
                }
                localStorage.setItem('md3_appearance_mode', mode);
            }

            // ===== 加载保存的设置 =====
            function loadSettings() {
                const colorTheme = localStorage.getItem('md3_color_theme') || 'blue';
                const appearanceMode = localStorage.getItem('md3_appearance_mode') || 'auto';
                applyColorTheme(colorTheme);
                applyAppearanceMode(appearanceMode);

                // 监听系统变化（自动模式时）
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleChange = (e) => {
                    const currentMode = localStorage.getItem('md3_appearance_mode') || 'auto';
                    if (currentMode === 'auto') {
                        document.body.classList.remove('light-mode', 'dark-mode');
                        document.body.classList.add(e.matches ? 'dark-mode' : 'light-mode');
                    }
                };
                mediaQuery.addEventListener('change', handleChange);
                // 保存监听器以便清理（但页面关闭无需）
            }

            // 加载设置
            loadSettings();

            // ===== DOM 引用 =====
            const fileInput = document.getElementById('fileInput');
            const uploadZone = document.getElementById('uploadZone');
            const statusBox = document.getElementById('statusBox');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const resultSection = document.getElementById('resultSection');
            const secretDisplay = document.getElementById('secretDisplay');
            const uriDisplay = document.getElementById('uriDisplay');
            const copyBtn = document.getElementById('copyBtn');
            const resetBtn = document.getElementById('resetBtn');
            const snackbar = document.getElementById('snackbar');
            const snackbarMessage = document.getElementById('snackbarMessage');

            let currentSecret = '';
            let currentUri = '';

            // ===== 工具函数 =====
            function maskSecret(secret) {
                if (!secret) return '****';
                const s = secret.trim();
                if (s.length <= 6) {
                    if (s.length <= 4) return s;
                    return s.slice(0, 4) + '****';
                }
                const head = s.slice(0, 4);
                const tail = s.slice(-4);
                return head + '****' + tail;
            }

            function showSnackbar(msg) {
                snackbarMessage.textContent = msg || '备用密钥已复制，请务必放在您认为安全的地方';
                snackbar.classList.add('show');
                clearTimeout(snackbar._hideTimer);
                snackbar._hideTimer = setTimeout(() => {
                    snackbar.classList.remove('show');
                }, 4500);
            }

            function copySecret() {
                if (!currentSecret) {
                    showSnackbar('没有可复制的密钥');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(currentSecret)
                        .then(() => {
                            showSnackbar('备用密钥已复制，请务必放在您认为安全的地方');
                        })
                        .catch(() => {
                            fallbackCopy(currentSecret);
                        });
                } else {
                    fallbackCopy(currentSecret);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showSnackbar('备用密钥已复制，请务必放在您认为安全的地方');
                } catch (e) {
                    showSnackbar('复制失败，请手动复制');
                }
                document.body.removeChild(textarea);
            }

            function showResult(secret, uri) {
                currentSecret = secret;
                currentUri = uri || '';
                secretDisplay.textContent = maskSecret(secret);
                uriDisplay.textContent = uri || '—';
                resultSection.classList.add('show');
            }

            function setStatus(type, message) {
                statusBox.className = 'status-box show';
                if (type === 'loading') {
                    statusBox.className = 'status-box show';
                    statusIcon.textContent = '⏳';
                    statusText.textContent = message || '正在识别二维码…';
                } else if (type === 'success') {
                    statusBox.className = 'status-box show success';
                    statusIcon.textContent = '✅';
                    statusText.textContent = message || '解码成功';
                } else if (type === 'error') {
                    statusBox.className = 'status-box show error';
                    statusIcon.textContent = '⚠️';
                    statusText.textContent = message || '解码失败，请尝试其他图片';
                } else {
                    statusBox.classList.remove('show');
                }
            }

            function hideStatus() {
                statusBox.classList.remove('show');
            }

            // ===== 验证 Secret =====
            function isValidSecret(secret) {
                if (!secret) return false;
                const s = secret.replace(/\s/g, '').toUpperCase();
                if (!/^[A-Z2-7]{12,}$/.test(s)) return false;
                return true;
            }

            // ===== 从数据中提取 Secret =====
            function parseSecretFromData(data) {
                if (!data) return null;
                const trimmed = data.trim();

                if (trimmed.startsWith('otpauth://')) {
                    try {
                        const url = new URL(trimmed);
                        const secret = url.searchParams.get('secret');
                        if (secret && isValidSecret(secret)) {
                            return { secret: secret.toUpperCase(), uri: trimmed };
                        }
                    } catch (_) {}
                }

                const clean = trimmed.replace(/\s/g, '').toUpperCase();
                if (isValidSecret(clean)) {
                    return { secret: clean, uri: '' };
                }

                if (trimmed.includes('secret=')) {
                    const match = trimmed.match(/[?&]secret=([^&]+)/i);
                    if (match) {
                        const secret = match[1].toUpperCase();
                        if (isValidSecret(secret)) {
                            return { secret, uri: trimmed };
                        }
                    }
                }

                return null;
            }

            // ===== 多策略解码 =====
            function decodeQRFromImage(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        tryDecode(img, 0);
                    };
                    img.onerror = function() {
                        setStatus('error', '图片加载失败，请检查文件是否损坏');
                    };
                    img.src = e.target.result;
                };
                reader.onerror = function() {
                    setStatus('error', '读取文件失败');
                };
                reader.readAsDataURL(file);
            }

            function tryDecode(img, attempt) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                // 灰度化 (attempt 1)
                if (attempt === 1) {
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        data[i] = gray;
                        data[i + 1] = gray;
                        data[i + 2] = gray;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                }

                const inversionModes = ['dontInvert', 'attemptBoth', 'onlyInvert'];
                const mode = inversionModes[attempt % inversionModes.length] || 'dontInvert';

                let code = null;
                try {
                    code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: mode,
                    });
                } catch (e) {
                    console.warn('jsQR error:', e);
                }

                if (code && code.data) {
                    const parsed = parseSecretFromData(code.data);
                    if (parsed) {
                        setStatus('success', '解码成功');
                        showResult(parsed.secret, parsed.uri);
                        return;
                    } else {
                        setStatus('error', '您提供的图片不是2FA二维码，请重新上传！');
                        return;
                    }
                }

                const next = attempt + 1;
                if (next < 6) {
                    tryDecode(img, next);
                } else {
                    setStatus('error', '未能识别二维码，请确保图片清晰且包含有效的2FA二维码');
                }
            }

            // ===== 重置 =====
            function resetAll() {
                currentSecret = '';
                currentUri = '';
                secretDisplay.textContent = '****';
                uriDisplay.textContent = '—';
                resultSection.classList.remove('show');
                hideStatus();
                fileInput.value = '';
                uploadZone.classList.remove('dragover');
            }

            // ===== 事件绑定 =====
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    const file = this.files[0];
                    if (file.type.startsWith('image/')) {
                        setStatus('loading', '正在识别二维码…');
                        decodeQRFromImage(file);
                    } else {
                        setStatus('error', '请选择图片文件');
                    }
                }
                this.value = '';
            });

            uploadZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });

            uploadZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });

            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    const file = files[0];
                    if (file.type.startsWith('image/')) {
                        setStatus('loading', '正在识别二维码…');
                        decodeQRFromImage(file);
                    } else {
                        setStatus('error', '请拖拽图片文件');
                    }
                }
            });

            copyBtn.addEventListener('click', copySecret);
            resetBtn.addEventListener('click', resetAll);

            // 初始状态
            resetAll();
            console.log('🔐 2FA 备用密钥提取工具 (Material Design) 已加载');
        })();
    </script>
</body>
</html>
